name: movias

services:
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: movias-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: ${AI_DATABASE_URL:-sqlite+aiosqlite:////app/data/database.db}
    depends_on:
      extractor:
        condition: service_healthy
    volumes:
      - ai-data:/app/data
      - ./ai/models:/app/models:ro
      - ./ai/config:/app/config:ro
      - ./extractor/data:/shared:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 6

  extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    container_name: movias-extractor
    restart: unless-stopped
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_DATABASE: ${DATABASE_DATABASE}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE}
      CSV_PATH: /shared/movias.csv
      RELATORIO_QUERY_BATCH_SIZE: ${RELATORIO_QUERY_BATCH_SIZE:-350}
      RELATORIO_QUERY_PARALLEL_WORKERS: ${RELATORIO_QUERY_PARALLEL_WORKERS:-4}
      LOG_LEVEL: ${EXTRACTOR_LOG_LEVEL:-INFO}
    volumes:
      - ./extractor/data:/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 6

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: movias-gateway
    restart: unless-stopped
    environment:
      AI_API_BASE_URL: http://ai:8000
      EXTRACTOR_API_BASE_URL: http://extractor:8000
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-30}
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    depends_on:
      ai:
        condition: service_healthy
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 6

volumes:
  ai-data:
