# config/data_ingestion_config.yaml

# ============================================================
# CONFIGURAÇÃO DE INGESTÃO DE DADOS
# ============================================================

# Dataset de entrada (telemetria completa)
dataset_path: "../datasets/full/telemetria_movias2025_features.csv"

# Diretório de saída (base)
output_dir: "../datasets"

# Parâmetros de formatação
formatter:
  min_days: 7
  min_weeks: 5
  max_gap: 3

# Parâmetros de geração de janelas
generator:
  history_size: 28
  forecast_horizon: 7
  n_windows_test: 4
  n_windows_val: 4
  skip_n_days: 0
  use_effective_period: true

# Categorias a processar
categories:
  - km_dia_clean
  - h_dia_clean