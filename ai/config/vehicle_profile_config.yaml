# config/vehicle_profile_config.yaml

# ============================================================
# CONFIGURAÇÃO DO VEHICLE PROFILE
# ============================================================
# Perfil semanal de veículos: features + classificação + versionamento

# ---- Features por extractor (por métrica) ----
features:
  km:
    seg:
      - cv_gaps
      - taxa_dias_ativos
      - p75
      - iqr
    day:
      - mean
      - std
      - p25
      - p75
      - iqr
      - prob_active
      - cv
    phase:
      - prob_active
      - mean
      - p75
      - iqr
      - cv
    cycle:
      - prob_active
      - mean
      - ratio_fim_inicio

  h:
    seg:
      - cv_gaps
      - taxa_dias_ativos
      - p75
      - iqr
    day:
      - mean
      - std
      - p25
      - p75
      - iqr
      - prob_active
      - cv
    phase:
      - prob_active
      - mean
      - p75
      - iqr
      - cv
    cycle:
      - prob_active
      - mean
      - ratio_fim_inicio

# ---- Parâmetros do VehicleProfile ----
profile:
  sample_size: 168            # Número máximo de amostras (7 dias * 4 semanas * 6 meses)
  p_upper: 95                 # Percentil superior para clipping
  n_jobs: 4                   # Threads paralelas
  batch_size: 10              # Tamanho do lote
